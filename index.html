<body>
    <header>
        <nav class="navbar" aria-label="Main navigation">
            <div class="nav-links">
                <a href="index.html" class="active">Home</a>

            <article class="post-card">

                    <div class="user-info">
                        <div class="avatar">TM</div>

        </aside>
