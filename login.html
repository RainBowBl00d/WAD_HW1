<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <header>
    <nav class="navbar">
      <div class="nav-links">
        <a href="index.html">Home</a>
      </div>
      <a href="login.html" class="login" title="User Profile / Login">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
        </svg>
      </a>
    </nav>
  </header>

  <main class="app-container form-page">
    <section class="post-card login-card">
      <h2>Welcome to PostIt</h2>
      <a href="#" class="accent-link">Create an account</a>
      <p class="subtext">or</p>
      <h3>Please log in</h3>

      <!-- Required inputs prevent form submission when empty (0.5 point) -->
      <form action="index.html" method="GET" class="login-form">
        <div class="form-group">
          <input type="email" name="email" placeholder="Email" required>
        </div>
        <div class="form-group">
          <input type="password" name="password" placeholder="Password" required>
        </div>
        <button type="submit" class="like-btn">Log in</button>
      </form>

      <a href="#" class="accent-link forget-pass">Forget password</a>
    </section>
  </main>

  <footer class="footer">
    <p>Footer</p>
  </footer>
</body>
</html>
